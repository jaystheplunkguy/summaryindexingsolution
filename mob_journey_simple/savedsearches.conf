# =====================================================================
# Mobile Journey - simple summary indexing
#   1 summary index : summary_mob_journey  (one row per order per step)
#   25 scheduled searches, one per step    (29 once 03/07/10/35 are added)
#
# Each search = that step's EXISTING master query up to the "All Order Types"
# line (the per-order part), unchanged, plus a 6-line footer:
#   - _time = when the order started the step
#   - only orders that started in ONE 15-min slot, SETTLE seconds ago, are
#     written, so every order is written once, after it has had time to finish
#     (SETTLE = 3600 for correlated steps, 900 for single-event steps 01/02/04/05)
# Grafana panels then read summary_mob_journey with the rest of the original
# query (from "All Order Types" onwards) unchanged - see grafana/.
# =====================================================================

[MOB_STEP01]
search = index="b2cforce" sourcetype="sfdc:transaction_log__c" "Product_Family__c=Mobiles" "OrderVlocityStatus__c=Ready To Submit" \
| rex max_match=0 field=_raw "OrderReferenceNumber__c=(?<OrderReferenceNumber>[^,}]+)" \
| rex max_match=0 field=_raw "OrderVlocityStatus__c=(?<OrderStatus>[^,}]+)" \
| rex max_match=0 field=_raw "BusinessAction__c=(?<BusinessAction>[^,}]+)" \
| rex max_match=0 field=_raw "serialNumberTransferType__c=(?<serialNumberTransferType>[^,}]+)" \
| eval OrderReferenceNumber     = coalesce(trim(mvindex(mvfilter(trim(OrderReferenceNumber)!="null"),0)), "null") \
| eval OrderStatus              = coalesce(trim(mvindex(mvfilter(trim(OrderStatus)!="null"),0)), "null") \
| eval BusinessAction           = coalesce(trim(mvindex(mvfilter(trim(BusinessAction)!="null"),0)), "null") \
| eval serialNumberTransferType = coalesce(trim(mvindex(mvfilter(trim(serialNumberTransferType)!="null"),0)), "null") \
| spath path=HasError__c output=HasError \
| dedup OrderReferenceNumber \
| where BusinessAction!="null" \
| eval order_type = case( \
    serialNumberTransferType=="Port In",  "Port-In", \
    serialNumberTransferType=="Port Out", "Port-Out", \
    IN(BusinessAction, "Sim Swap Activation", "Sim Swap Dispatch"), "SIM Change", \
    IN(BusinessAction, "Add New", "Add Device", "Reconnect"), "Connect", \
    IN(BusinessAction, "BoltOns", "AddReplace Promotion", "AddReplace Discount", "Downgrade", "Upgrade", "Redeem", "Change Number"), "Modify", \
    IN(BusinessAction, "Disconnect RO", "Disconnect", "Disconnect Commitment", "Disconnect Connection", "Disconnect Tier"), "Disconnect", \
    true(), "Others" \
  ) \
| eval isValid = if(OrderStatus=="Ready To Submit", 1, 0) \
| eval isGood  = if(isValid==1 AND HasError=="false", 1, 0) \
| eval step="01", order_key=OrderReferenceNumber, _time=_time \
| addinfo \
| eval slot_end = floor((info_max_time - 900) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
cron_schedule = 2-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP02]
search = index="b2cforce" sourcetype="sfdc:transaction_log__c" "Product_Family__c=Mobiles" \
| rex max_match=0 field=_raw "OrderReferenceNumber__c=(?<OrderReferenceNumber>[^,}]+)" \
| rex max_match=0 field=_raw "BusinessAction__c=(?<BusinessAction>[^,}]+)" \
| rex max_match=0 field=_raw "OrderVlocityStatus__c=(?<OrderStatus>[^,}]+)" \
| rex max_match=0 field=_raw "serialNumberTransferType__c=(?<serialNumberTransferType>[^,}]+)" \
| eval OrderReferenceNumber     = coalesce(trim(mvindex(mvfilter(trim(OrderReferenceNumber)!="null"),0)), "null") \
| eval BusinessAction           = coalesce(trim(mvindex(mvfilter(trim(BusinessAction)!="null"),0)), "null") \
| eval OrderStatus              = coalesce(trim(mvindex(mvfilter(trim(OrderStatus)!="null"),0)), "null") \
| eval serialNumberTransferType = coalesce(trim(mvindex(mvfilter(trim(serialNumberTransferType)!="null"),0)), "null") \
| spath path=HasError__c output=HasError \
| where BusinessAction!="null" AND OrderReferenceNumber!="null" \
| where OrderStatus=="Ready To Submit" \
| dedup OrderReferenceNumber sortby -_time \
| eval order_type = case( \
    serialNumberTransferType=="Port In",  "Port-In", \
    serialNumberTransferType=="Port Out", "Port-Out", \
    IN(BusinessAction, "Sim Swap Activation", "Sim Swap Dispatch"), "SIM Change", \
    IN(BusinessAction, "Add New", "Add Device", "Reconnect"), "Connect", \
    IN(BusinessAction, "BoltOns", "AddReplace Promotion", "AddReplace Discount", "Downgrade", "Upgrade", "Redeem", "Change Number"), "Modify", \
    IN(BusinessAction, "Disconnect RO", "Disconnect", "Disconnect Commitment", "Disconnect Connection", "Disconnect Tier"), "Disconnect", \
    true(), "Others" \
  ) \
| eval is_valid = 1 \
| eval is_good  = if(HasError=="false", 1, 0) \
| eval step="02", order_key=OrderReferenceNumber, _time=_time \
| addinfo \
| eval slot_end = floor((info_max_time - 900) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
cron_schedule = 3-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP04]
search = index=amp-rtfa-app application="svc-fraud-assessment" "assess-vlocity" "Server responded with a response" \
| rex field=_raw "\"orderNumber\"\s*:\s*\"(?<order_number>[^\"]+)\"" \
| rex field=_raw "\"assessmentDecision\"\s*:\s*\"(?<decision>[^\"]+)\"" \
| rex field=_raw "\"responseTime\"\s*:\s*(?<response_ms>\d+)" \
| where isnotnull(order_number) AND isnotnull(decision) \
| where match(order_number, "^[A-Z]2[4-7]\d{6,}") \
| eval decision = trim(decision), response_ms = tonumber(response_ms) \
| where decision IN ("Accept", "Decline", "Investigate") \
| stats latest(decision) AS decision, latest(response_ms) AS response_ms, max(_time) AS t_decision BY order_number \
| eval latency_sec = response_ms / 1000 \
| eval step="04", order_key=order_number, _time=t_decision \
| addinfo \
| eval slot_end = floor((info_max_time - 900) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
cron_schedule = 4-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP05]
search = index="b2cforce" sourcetype="sfdc:transaction_log__c" "Customer.Sales-Order.Update.Info.V2.event" "OrderStatusChange" "B2C-Vlocity" "Status__c=In Progress" "AcknowledgedDateTime__c" \
| rex max_match=0 field=_raw "OrderId__c=(?<order_id>[^,}]+)" \
| rex max_match=0 field=_raw "CorrelationId__c=(?<correlation_id>[^,}]+)" \
| where isnotnull(order_id) AND isnotnull(correlation_id) \
| rex max_match=0 field=_raw "AcknowledgedDateTime__c=(?<submit_date>[^,}]+)" \
| eval order_id = coalesce(trim(mvindex(mvfilter(trim(order_id)!="null"),0)), "null") \
| eval correlation_id = coalesce(trim(mvindex(mvfilter(trim(correlation_id)!="null"),0)), "null") \
| stats earliest(order_id) as order_id earliest(submit_date) as submit_date min(_time) as first_time by correlation_id \
| lookup local=true kv_b2c_mobile_order_tracker correlationId as correlation_id OUTPUTNEW productFamily orderType SrNumTrnsType \
| where productFamily IN ("General", "Mobiles", "Postpaid Mobile") \
| eval order_type = if(like(orderType,"%Disconnect%"),"DISCONNECT", \
                    if(like(orderType,"%Downgrade%") OR like(orderType,"%Upgrade%") \
                       OR orderType=="Redeem" \
                       OR like(orderType,"%Sim Swap%") \
                       OR orderType=="Change Number" \
                       OR orderType=="BoltOns" \
                       OR orderType=="Add Device" \
                       OR orderType=="Add IDD" \
                       OR orderType=="AddReplace Discount" \
                       OR orderType=="AddReplace Promotion", \
                       "MODIFY", \
                    if(orderType=="Add New" OR orderType=="Reconnect", "ADD NEW", "others"))) \
| eval port_type = if(IN(SrNumTrnsType,"Port Out"),"Port Out",if(IN(SrNumTrnsType,"Port In"),"Port In","NON-PORT")) \
| eval Order_Type = IF((port_type="Port In"),"Port In",IF((port_type="Port Out"),"Port Out",IF((order_type="ADD NEW"),"ADD NEW",IF((order_type="MODIFY"),"MODIFY",IF((order_type="DISCONNECT"),"DISCONNECT","others"))))) \
 \
| eval step="05", order_key=correlation_id, _time=first_time \
| addinfo \
| eval slot_end = floor((info_max_time - 900) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
cron_schedule = 5-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP06]
search = (index="b2cforce" sourcetype="sfdc:transaction_log__c" "Customer.Sales-Order.Update.Info.V2.event" "OrderStatusChange" "B2C-Vlocity" "Status__c=In Progress" "AcknowledgedDateTime__c") OR (index="b2c-omplus" sourcetype="aws:s3" "Common Order Spec" "B2C-Vlocity") \
| eval src = if(index=="b2cforce","b2cforce","omplus") \
| rex max_match=0 field=_raw "OrderId__c=(?<oid_b2c>[^,}]+)" \
| rex max_match=0 field=_raw "CorrelationId__c=(?<cid_b2c>[^,}]+)" \
| where src!="b2cforce" OR (isnotnull(oid_b2c) AND isnotnull(cid_b2c)) \
| rex max_match=0 field=_raw "AcknowledgedDateTime__c=(?<submit_date>[^,}]+)" \
| eval oid_b2c = if(src!="b2cforce", null(), coalesce(trim(mvindex(mvfilter(trim(oid_b2c)!="null"),0)), "null")) \
| eval cid_b2c = if(src!="b2cforce", null(), coalesce(trim(mvindex(mvfilter(trim(cid_b2c)!="null"),0)), "null")) \
| eval submit_epoch = if(src=="b2cforce", strptime(submit_date,"%Y-%m-%d %H:%M:%S")+36000, null()) \
| rex mode=sed "s/\\\\//g s/\"\"/\"/g" \
| rex max_match=0 field=_raw "\"ATTR_OTH_CORRELATION_ID\":\"(?<cid_omplus>[^\"]+)\"" \
| rex max_match=0 field=_raw "\"externalId\":\"(?<oid_omplus>[^\"]+)\"" \
| eval cid_omplus = if(src=="omplus", mvindex(cid_omplus,-1), null()) \
| eval oid_omplus = if(src=="omplus", mvindex(oid_omplus,-1), null()) \
| eval processing_epoch = if(src=="omplus", _time, null()) \
| eval correlation_id = coalesce(cid_b2c, cid_omplus) \
| eval order_id = oid_b2c \
| where isnotnull(correlation_id) \
| fields _time src correlation_id order_id submit_epoch processing_epoch \
| stats earliest(order_id) as order_id min(submit_epoch) as submit_epoch min(processing_epoch) as processing_epoch min(_time) as first_time by correlation_id \
| where isnotnull(submit_epoch) \
| lookup local=true kv_b2c_mobile_order_tracker correlationId as correlation_id OUTPUTNEW productFamily orderType SrNumTrnsType \
| where productFamily IN ("General", "Mobiles", "Postpaid Mobile") \
| eval order_type = if(like(orderType,"%Disconnect%"),"DISCONNECT", \
                    if(like(orderType,"%Downgrade%") OR like(orderType,"%Upgrade%") \
                       OR orderType=="Redeem" \
                       OR like(orderType,"%Sim Swap%") \
                       OR orderType=="Change Number" \
                       OR orderType=="BoltOns" \
                       OR orderType=="Add Device" \
                       OR orderType=="Add IDD" \
                       OR orderType=="AddReplace Discount" \
                       OR orderType=="AddReplace Promotion", \
                       "MODIFY", \
                    if(orderType=="Add New" OR orderType=="Reconnect", "ADD NEW", "others"))) \
| eval port_type = if(IN(SrNumTrnsType,"Port Out"),"Port Out",if(IN(SrNumTrnsType,"Port In"),"Port In","NON-PORT")) \
| eval Order_Type = IF((port_type="Port In"),"Port In",IF((port_type="Port Out"),"Port Out",IF((order_type="ADD NEW"),"ADD NEW",IF((order_type="MODIFY"),"MODIFY",IF((order_type="DISCONNECT"),"DISCONNECT","others"))))) \
| eval submit_time = strftime(submit_epoch, "%Y-%m-%d %H:%M:%S") \
| eval processing_time = strftime(processing_epoch, "%Y-%m-%d %H:%M:%S") \
| eval latency_seconds = processing_epoch - submit_epoch \
| eval latency_minutes = round(latency_seconds/60, 2) \
| eval slo_threshold_seconds = 10 \
| eval slo_met = if(isnotnull(processing_epoch) AND latency_seconds<=slo_threshold_seconds, 1, 0) \
| eval step="06", order_key=correlation_id, _time=first_time \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 6-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP08]
search = | multisearch \
    [ search index="amp-dpp-o2a" application="svc-digitisation-message-broker" eventKey="OrderManagement.OrderItem.MSISDN.Info.v2.event" flowName="digitisationDVPublisher" "MSISDN Reserved" "Composite Mobile NAAS Service" ("M0000003" OR "M0000004" OR "M0000005" OR "M0000006") \
      | rex field=message "Received Message:\s(?<json>\{[^\n]+)\swith headers:" \
      | spath input=json path=timestamp              output=eventTimestamp \
      | spath input=json path=correlationId          output=correlationId \
      | spath input=json path=data.commercialOrderId output=orderId \
      | where isnotnull(correlationId) \
      | eval end_time = strptime(eventTimestamp, "%Y-%m-%dT%H:%M:%S") \
      | eval end_evt_time = _time \
      | fields correlationId, orderId, end_time, end_evt_time ] \
    [ search index="amp-dpp-o2a" application="svc-digitisation-message-broker" eventKey="OrderManagement.Order.Milestone.Info.v2.event" flowName="omplusFPDSDispatcher" "Order Received" "Milestone Achieved" \
      | rex field=message "Received Message:\s(?<json>\{[^\n]+)\swith headers:" \
      | spath input=json path=timestamp     output=eventTimestamp \
      | spath input=json path=correlationId output=correlationId \
      | where isnotnull(correlationId) \
      | eval start_time = strptime(eventTimestamp, "%Y-%m-%dT%H:%M:%S") \
      | eval start_evt_time = _time \
      | fields correlationId, start_time, start_evt_time ] \
    [ search index="amp-dpp-o2a" "Publishing event" "Execution.EOMSYS.request-received.event.aomd" "B2C-Vlocity" ("M0000003" OR "M0000004" OR "M0000005" OR "M0000006") \
      | rex mode=sed "s/\\\//g" \
      | rex "Publishing event : (?<json>\{[^\n]+)" \
      | spath input=json path=correlationId                                                 output=correlationId \
      | spath input=json path=data.request.body.orderItem{}.product.action                   output=Order_type_adj \
      | spath input=json path=data.request.body.orderItem{}.orderItemCharacteristic{}.value  output=Port_type \
      | where isnotnull(correlationId) \
      | fields correlationId, Order_type_adj, Port_type \
      | eval Port_type = if(IN(Port_type, "Port Out"), "Port Out", if(IN(Port_type, "Port In"), "Port In", "NON-PORT")) \
      | eval Order_type_adj = if(IN(Order_type_adj, "cease"), "deactivateContract", if(IN(Order_type_adj, "modify"), "modify", if(IN(Order_type_adj, "add"), "add", "others"))) \
      | eval order_type = if(Port_type="Port In", "Port-In", if(Port_type="Port Out", "Port-Out", if(Order_type_adj="add", "Connect", if(Order_type_adj="modify", "Modify", if(Order_type_adj="deactivateContract", "Disconnect", "ASAP Connections"))))) \
      | fields correlationId, order_type ] \
| stats \
    first(orderId)      AS orderId, \
    min(start_time)     AS start_time, \
    max(end_time)       AS end_time, \
    min(start_evt_time) AS start_evt_time, \
    max(end_evt_time)   AS end_evt_time, \
    values(order_type)  AS order_type \
    BY correlationId \
| where isnotnull(end_time) AND isnotnull(mvindex(order_type, 0)) \
| eval order_type = mvindex(order_type, 0) \
| eval latency_sec = if(isnotnull(start_time) AND isnotnull(end_time), round(end_time - start_time, 2), null()) \
| eval slo_met = if(isnotnull(latency_sec) AND latency_sec >= 0 AND latency_sec <= 30, 1, 0) \
| eval step="08", order_key=correlationId, _time=coalesce(start_evt_time, end_evt_time) \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 7-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP09]
search = (index="b2c-omplus" ("Order Received" OR "WTC Order Submit")) \
OR \
(index="b2cforce" "Product_Family__c=Mobiles") \
| rex field=_raw "commercialOrderId[^A-Z0-9]*(?<order_id_om>[A-Z][0-9]{14})" \
| rex field=_raw "OrderReferenceNumber__c=(?<order_id_1>[^,}]+)" \
| rex field=_raw "orderReferenceNumber=(?<order_id_2>[^,}]+)" \
| eval order_id=coalesce(order_id_om,order_id_1,order_id_2) \
| eval order_id=trim(order_id," \"") \
| rex field=_raw "eventName[^A-Za-z]*(?<event_name>Order Received|WTC Order Submit)" \
| rex field=_raw "timestamp[^0-9]*(?<evt_ts>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)" \
| eval evt_epoch=coalesce(strptime(evt_ts,"%Y-%m-%dT%H:%M:%SZ"), _time) \
| stats \
    min(eval(if(event_name="Order Received",evt_epoch,null()))) as received_epoch \
    min(eval(if(event_name="WTC Order Submit",evt_epoch,null()))) as wtc_submit_epoch \
    min(eval(if(event_name="Order Received",_time,null()))) as received_evt_time \
    min(eval(if(event_name="WTC Order Submit",_time,null()))) as wtc_submit_evt_time \
    by order_id \
| where isnotnull(received_epoch) AND isnotnull(wtc_submit_epoch) \
| eval latency_sec=round(wtc_submit_epoch-received_epoch,2) \
| eval slo_met=if(latency_sec>=0 AND latency_sec<=300,1,0) \
| eval step="09", order_key=order_id, _time=coalesce(received_evt_time, wtc_submit_evt_time) \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 8-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP11]
search = (index="b2c-omplus" sourcetype="aws:s3" "EOMSYS" "Success" "Final generateAndSendPayload response" ("M0000003" OR "M0000004" OR "M0000006")) \
    OR \
(index="amp-dpp-o2a" sourcetype="aws:kinesis" "Execution.EOMSYS.request-received.event.aomd" "Received request:" "B2C-Vlocity" ("M0000003" OR "M0000004" OR "M0000006")) \
| eval src = if(index=="b2c-omplus","omplus","eomsys") \
| rex field=message "(?msi)(?<eomsys_json>\{.+\})" \
| spath input=eomsys_json output=cid_eomsys path=correlationId \
| spath input=eomsys_json output=recv_ts path=timestamp \
| rex mode=sed "s/\\\\//g s/\"\"/\"/g" \
| rex "payload: (?<omplus_json>\{.+)\}\"" \
| rex field=omplus_json "(?s)correlationId\W+value\W+(?<cid_omplus>[^\"]+)" \
| spath input=omplus_json output=order_type path=orderItem{}.product.action \
| rex field=omplus_json "(?s)serviceNumberTransferType\W+value\W+(?<port_type>[^\"]+)" \
| eval correlation_id = coalesce(cid_omplus, cid_eomsys) \
| where isnotnull(correlation_id) \
| eval submit_epoch = if(src=="omplus", _time, null()) \
| eval recv_epoch = if(src=="eomsys", strptime(recv_ts,"%Y-%m-%dT%H:%M:%S%z"), null()) \
| eval order_type = coalesce(trim(mvindex(mvfilter(trim(order_type)!="null"),0)), "null") \
| eval port_type = if(IN(port_type,"Port Out"),"Port Out",if(IN(port_type,"Port In"),"Port In","NON-PORT")) \
| eval order_type = if(IN(order_type,"cease"),"DISCONNECT",if(IN(order_type,"modify"),"MODIFY",if(IN(order_type,"add"),"ADD NEW","others"))) \
| eval Order_Type = if(src!="omplus", null(), \
    IF((port_type="Port In"),"Port In", \
    IF((port_type="Port Out"),"Port Out", \
    IF((order_type="ADD NEW"),"ADD NEW", \
    IF((order_type="MODIFY"),"MODIFY", \
    IF((order_type="DISCONNECT"),"DISCONNECT","others")))))) \
| fields _time src correlation_id submit_epoch recv_epoch Order_Type \
| stats min(submit_epoch) as submit_epoch \
        min(recv_epoch) as recv_epoch \
        earliest(Order_Type) as Order_Type \
        by correlation_id \
| where isnotnull(submit_epoch) \
| eval submit_time = strftime(submit_epoch, "%Y-%m-%d %H:%M:%S") \
| eval recv_time = strftime(recv_epoch, "%Y-%m-%d %H:%M:%S") \
| eval latency_seconds = recv_epoch - submit_epoch \
| eval latency_minutes = round(latency_seconds/60, 2) \
| eval slo_threshold_seconds = 60 \
| eval slo_met = if(isnotnull(recv_epoch) AND latency_seconds<=slo_threshold_seconds, 1, 0) \
| eval step="11", order_key=correlation_id, _time=submit_epoch \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 9-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP12]
search = index="amp-dpp-o2a" \
( \
  ( \
    "Publishing event" \
    "Execution.EOMSYS.request-received.event.aomd" \
    ("M0000003" OR "M0000004" OR "M0000005" OR "M0000006") \
    "B2C-Vlocity" \
  ) \
  OR \
  ( \
    application="svc-eomsys-message-broker" \
    eventKey="EOMSYS.Order.ManageOrder.Info.v2.event" \
    "profileStartedNotification" \
    "B2C-Vlocity" \
    NOT "orderItemId" \
  ) \
  OR \
  ( \
    application="kinesis-integration-bridge-lambda-prod" \
    "ActivityInProgressNotification" \
    "B2C-Vlocity" \
    "Customer Order Manager Started" \
  ) \
) \
| fields _time _raw \
| rex field=_raw "external(?:Order)?Id\W{1,6}(?<order_id>[A-L]\d{6,})" \
| where isnotnull(order_id) \
| eval is_request=if(match(_raw,"request-received"),1,0) \

    search index="amp-dpp-o2a" "EOMSYS.Order.ManageOrder.Info.orderCompleted.v2.event" \
    | eval search_text=coalesce(message,_raw) \
    | rex field=search_text "externalOrderId[^A-Z0-9]*(?<order_id>[A-Z][0-9]{14})" \
    | rex field=search_text "eventKey[^A-Za-z]*EOMSYS\.Order\.ManageOrder\.Info\.orderCompleted\.v2\.event[^?]*?timestamp[^0-9]*(?<eomsys_completed>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2}))" \
    | eval eomsys_clean=replace(eomsys_completed,"\.[0-9]+","") \
    | eval eomsys_clean=replace(eomsys_clean,"Z$","+0000") \
    | eval eomsys_clean=replace(eomsys_clean,"([+-][0-9]{2}):([0-9]{2})$","\1\2") \
    | eval eomsys_epoch=strptime(eomsys_clean,"%Y-%m-%dT%H:%M:%S%z") \
    | where isnotnull(order_id) AND isnotnull(eomsys_epoch) \
    | stats earliest(eomsys_epoch) as eomsys_epoch by order_id \
    | fields order_id eomsys_epoch | eval has_req=1] \
| stats max(eomsys_epoch) AS eomsys_epoch, max(wtc_epoch) AS wtc_epoch, max(wtc_evt_time) AS wtc_evt_time, max(has_act) AS has_act, max(has_req) AS has_req BY order_id \
| where has_act>0 \
| eval latency_sec=if(isnotnull(eomsys_epoch), if(wtc_epoch-eomsys_epoch<0, 0, round(wtc_epoch-eomsys_epoch,2)), null()) \
| eval slo_met=if(isnotnull(latency_sec) AND latency_sec<=300,1,0) \
| eval step="33", order_key=order_id, _time=wtc_evt_time \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 5-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
alert.track = 0

[MOB_STEP34]
search = index="amp-dpp-o2a" \
    application="svc-eomsys-message-broker" \
    flowName="eomsysPublisher" \
    eventKey="Execution.EOMSYS.activity-statusChange.event.aomd" \
    "Product Order Fulfillment Completed" \
    "Request dispatched" \
    level="INFO" \
| rex field=message "notificationType[\":\s]+(?<notificationType>[^\",}]+)" \
| where notificationType IN ("ActivityInProgressNotification", "ActivityCompletedNotification") \
| rex field=message "elementName[\":\s]+(?<elementName>[^\",}]+)" \
| where elementName="Product Order Fulfillment Completed" \
| rename correlation_id AS correlationId \
| stats \
    min(eval(if(notificationType="ActivityInProgressNotification", _time, null()))) AS start_time, \
    max(eval(if(notificationType="ActivityCompletedNotification", _time, null()))) AS end_time \
    BY correlationId \
| eval final_outcome = if(isnotnull(end_time), "Success", "Failure") \
| eval latency_sec = if(isnotnull(end_time) AND isnotnull(start_time), round(end_time - start_time, 2), null()) \
| eval has_act=1 \
| append \
    [search index="amp-dpp-o2a" "EOMSYS" "Publishing event" "Execution.EOMSYS.request-received.event.aomd" ("M0000003" OR "M0000004" OR "M0000005" OR "M0000006") \
    | rex field=_raw "correlationId[\":\s]+(?<correlationId>[^\",}]+)" \
    | eval is_portin = if(like(_raw, "%serviceNumberTransferType%"), 1, 0) \
    | eval is_modify = if(like(_raw, "%\"action\" : \"modify\"%") OR like(_raw, "%\"action\":\"modify\"%"), 1, 0) \
    | eval is_disconnect = if(like(_raw, "%\"action\" : \"cease\"%") OR like(_raw, "%\"action\":\"cease\"%") OR like(_raw, "%\"action\" : \"disconnect\"%") OR like(_raw, "%\"action\":\"disconnect\"%"), 1, 0) \
    | stats max(is_portin) AS is_portin, max(is_modify) AS is_modify, max(is_disconnect) AS is_disconnect BY correlationId \
    | fields correlationId, is_portin, is_modify, is_disconnect | eval has_req=1] \
| stats max(end_time) AS end_time, values(final_outcome) AS final_outcome, max(is_disconnect) AS is_disconnect, max(is_modify) AS is_modify, max(is_portin) AS is_portin, max(latency_sec) AS latency_sec, max(start_time) AS start_time, max(has_act) AS has_act, max(has_req) AS has_req BY correlationId \
| where has_act>0 \
| eval order_type = case( \
    is_disconnect=1, "Disconnect", \
    is_modify=1, "Modify", \
    is_portin=1, "Port-In", \
    is_portin=0 OR isnull(is_portin), "Connect", \
    1==1, "Unknown" \
  ) \
| eval step="34", order_key=correlationId, _time=coalesce(start_time, end_time) \
| addinfo \
| eval slot_end = floor((info_max_time - 3600) / 900) * 900 \
| where _time >= slot_end - 900 AND _time < slot_end \
| fields - info_* slot_end \
| collect index=summary_mob_journey
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
cron_schedule = 6-59/15 * * * *
enableSched = 1
realtime_schedule = 0
schedule_window = 0
